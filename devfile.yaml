schemaVersion: 2.2.0
metadata:
  name: multi-repo-devspace
  attributes:
    che-editor.workspaceDir: /projects
# Native Devfile Git Checkouts
projects:

  - name: ocp-gitops
    clonePath: crowdsalat/ocp-gitops
    git:
      remotes:
        origin: "git@github.com:CrowdSalat/ocp-gitops.git"
      checkoutFrom:
        revision: "main"

  - name: workstation-playbook
    clonePath: crowdsalat/workstation-playbook
    git:
      remotes:
        origin: "git@github.com:CrowdSalat/workstation-playbook.git"
      checkoutFrom:
        revision: "main"

  - name: bootstrap-gh-actions
    clonePath: crowdsalat/bootstrap-gh-actions
    git:
      remotes:
        origin: "git@github.com:CrowdSalat/bootstrap-gh-actions.git"
      checkoutFrom:
        revision: "main"

  - name: homelab
    clonePath: crowdsalat/homelab
    git:
      remotes:
        origin: "git@github.com:CrowdSalat/homelab.git"
      checkoutFrom:
        revision: "main"

  - name: medi-bucher
    clonePath: crowdsalat/medi-bucher
    git:
      remotes:
        origin: "git@github.com:CrowdSalat/medi-bucher.git"
      checkoutFrom:
        revision: "main"

  - name: teddycloud-spotify-radio-shim
    clonePath: crowdsalat/teddycloud-spotify-radio-shim
    git:
      remotes:
        origin: "git@github.com:CrowdSalat/teddycloud-spotify-radio-shim.git"
      checkoutFrom:
        revision: "main"

  - name: teddycloud-mock-toniebox
    clonePath: crowdsalat/teddycloud-mock-toniebox
    git:
      remotes:
        origin: "git@github.com:CrowdSalat/teddycloud-mock-toniebox.git"
      checkoutFrom:
        revision: "main"

components:
- name: universal-developer-image
  container:
    image: registry.redhat.io/devspaces/udi-rhel9:latest
    memoryLimit: 32Gi
    memoryRequest: 8Gi
    cpuLimit: "6"
    cpuRequest: "1"
    mountSources: true